[package]
name = "vero-scanner-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
rayon = "1"

# RUSTSEC-2026-0204: pin crossbeam-epoch away from vulnerable 0.9.18;
# rayon pulls this in transitively via rayon-core -> crossbeam-deque.
crossbeam-epoch = "0.9.20"

[[bin]]
name = "scanner"
path = "src/main.rs"
