name: Policy Compliance Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  policy-check:
    name: OPA Policy Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/audit-guard/package-lock.json

      - name: Install audit-guard dependencies
        run: npm ci
        working-directory: src/audit-guard

      - name: Build policy engine
        run: npm run build
        working-directory: src/audit-guard

      - name: Get list of changed files
        id: changed-files
        run: |
          FILES=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/\( {{ github.repository }}/pulls/ \){{ github.event.pull_request.number }}/files?per_page=100" \
            | jq -r '.[].filename' | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Extract PR data, sign once, evaluate policy
        id: evaluation
        working-directory: src/audit-guard
        env:
          CI_RELAYER_SECRET: ${{ secrets.CI_RELAYER_SECRET }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          GUARDIAN_DASH_URL: ${{ secrets.GUARDIAN_DASH_URL }}
          GUARDIAN_DASH_TOKEN: ${{ secrets.GUARDIAN_DASH_TOKEN }}
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE }}
          MAINTENANCE_MESSAGE: ${{ vars.MAINTENANCE_MESSAGE }}
          # AUDIT_KEYPAIR_SECRET / ANCHOR_ON_CHAIN intentionally omitted (PR-triggered).
        run: |
          node <<'EOF'
          const fs = require('fs');
          const { Keypair } = require('@stellar/stellar-sdk');
          const PolicyEngine = require('./dist/policy-engine').default;

          const relayerKeypair = Keypair.fromSecret(process.env.CI_RELAYER_SECRET);
          // AUTHORIZED_ADDRESSES must include the CI relayer public key or
          // verifyRelayerSignature always emits RELAYER_UNAUTHORIZED.
          process.env.AUTHORIZED_ADDRESSES = relayerKeypair.publicKey();

          let filesModified = [];
          try {
            filesModified = JSON.parse(process.env.CHANGED_FILES || '[]');
            if (!Array.isArray(filesModified)) {
              filesModified = [];
            }
          } catch (e) {
            console.error('Error parsing CHANGED_FILES:', e);
            filesModified = [];
          }

          const fileContents = {};
          for (const file of filesModified) {
            if (file && fs.existsSync(file)) {
              try {
                fileContents[file] = fs.readFileSync(file, 'utf-8');
              } catch (e) {
                console.warn(`Warning: Could not read file ${file}`);
              }
            }
          }

          // Build the exact object that getSignaturePayload() will re-stringify.
          // Do not mutate files_modified / additions / deletions after signing.
          const timestamp = Date.now();
          const prData = {
            pull_request: {
              title: process.env.PR_TITLE,
              body: process.env.PR_BODY,
              labels: JSON.parse(process.env.PR_LABELS || '[]'),
              base_branch: process.env.BASE_BRANCH,
              head_branch: process.env.HEAD_BRANCH,
              number: parseInt(process.env.PR_NUMBER, 10),
              author: process.env.PR_AUTHOR,
            },
            files_modified: filesModified,
            additions: parseInt(process.env.ADDITIONS, 10) || 0,
            deletions: parseInt(process.env.DELETIONS, 10) || 0,
            dependencies_added: undefined,
            dependencies_updated: undefined,
            relayer: relayerKeypair.publicKey(),
            timestamp,
            // file_contents is NOT part of getSignaturePayload — safe to attach after.
            file_contents: fileContents,
          };

          const payload = JSON.stringify({
            pull_request: prData.pull_request,
            files_modified: prData.files_modified,
            additions: prData.additions,
            deletions: prData.deletions,
            dependencies_added: prData.dependencies_added,
            dependencies_updated: prData.dependencies_updated,
            relayer: prData.relayer,
            timestamp: prData.timestamp,
          });
          prData.signature = relayerKeypair.sign(Buffer.from(payload)).toString('hex');

          fs.writeFileSync('/tmp/pr-data.json', JSON.stringify(prData, null, 2));
          console.log('✅ PR data signed once with final files_modified');

          const engine = new PolicyEngine();
          (async () => {
            const result = await engine.evaluate(prData);

            // Anchoring never happens on pull_request workflows.
            await engine.reportToDashboard(result, prData);

            fs.writeFileSync('/tmp/policy-result.json', JSON.stringify(result, null, 2));

            const report = engine.generateReport(result);
            console.log('REPORT<<EOF\n' + report + '\nEOF');

            const githubOutput = process.env.GITHUB_OUTPUT;
            if (githubOutput) {
              fs.appendFileSync(githubOutput, `status=${result.status}\n`);
              fs.appendFileSync(githubOutput, `violations=${result.violations_count}\n`);
            }

            const relayerViolations = (result.violations || []).filter((v) =>
              String(v.rule || '').startsWith('RELAYER_')
            );
            if (relayerViolations.length > 0) {
              console.error('Relayer violations:', JSON.stringify(relayerViolations, null, 2));
            }

            process.exit(result.violations.length > 0 ? 1 : 0);
          })().catch((e) => {
            console.error(e);
            process.exit(1);
          });
          EOF

      - name: Comment PR with policy result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultPath = '/tmp/policy-result.json';
            if (!fs.existsSync(resultPath)) {
              const body = '## 🔒 Policy Compliance Check\n\n' +
                'Status: ⚠️ CHECK FAILED\n\n' +
                'The policy evaluation step failed to run (no result file). This is usually caused by missing CI secrets for forked PRs or an earlier script error.\n\n' +
                'Please check the workflow logs.';
              if (context.payload.pull_request && context.payload.pull_request.head && context.payload.pull_request.head.repo && context.payload.pull_request.head.repo.full_name !== `\( {context.repo.owner}/ \){context.repo.repo}`) {
                console.log('PR from fork; skipping comment/status because the integration cannot access fork repo.');
                return;
              }
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              return;
            }
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf-8'));

            let body = '## 🔒 Policy Compliance Check\n\n';
            body += `**Status:** ${result.status === 'COMPLIANT' ? '✅ COMPLIANT' : '❌ NON_COMPLIANT'}\n\n`;

            if (result.maintenance_alert) {
              body += `> [!IMPORTANT]\n`;
              body += `> ### 🚧 MAINTENANCE NOTICE\n`;
              body += `> ${result.maintenance_alert}\n\n`;
            }

            body += `${result.summary}\n\n`;

            if (result.violations.length > 0) {
              body += '### ❌ Violations\n\n';
              for (const v of result.violations) {
                body += `- **\( {v.rule}** [ \){v.severity}]\n`;
                body += `  ${v.message}\n`;
                body += `  > ${v.detail}\n\n`;
              }
            }

            if (result.warnings.length > 0) {
              body += '### ⚠️ Warnings\n\n';
              for (const w of result.warnings) {
                body += `- **\( {w.rule}** [ \){w.severity}]\n`;
                body += `  ${w.message}\n`;
                body += `  > ${w.detail}\n\n`;
              }
            }

            if (result.security_tip) {
              body += '---\n';
              body += `### 🎓 Security Training: ${result.security_tip.title}\n\n`;
              body += `${result.security_tip.content}\n\n`;
            }

            body += '---\n';
            body += '*This PR has been evaluated against Vero Protocol compliance policies. ';
            body += 'Fix violations to proceed.*\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Set PR status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultPath = '/tmp/policy-result.json';
            if (!fs.existsSync(resultPath)) {
              github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.payload.pull_request.head.sha,
                state: 'error',
                description: 'Policy evaluation failed to produce a result.',
                context: 'Policy Compliance',
                target_url: `\( {context.serverUrl}/ \){context.repo.owner}/\( {context.repo.repo}/actions/runs/ \){context.runId}`
              });
              return;
            }
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf-8'));

            const state = result.status === 'COMPLIANT' ? 'success' : 'failure';
            const description = result.summary;

            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: state,
              description: description,
              context: 'Policy Compliance',
              target_url: `\( {context.serverUrl}/ \){context.repo.owner}/\( {context.repo.repo}/actions/runs/ \){context.runId}`
            });

      - name: Fail if violations
        if: failure() || steps.evaluation.outcome == 'failure'
        run: |
          echo "❌ Policy violations detected. Fix issues to proceed."
          exit 1
