name: 📚 Documentation
description: Report a documentation gap or suggest improvements
title: "[Docs]: "
labels: ["documentation"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 📚 Documentation
        Help us improve the documentation for vero-audit-guard.

  - type: dropdown
    id: type
    attributes:
      label: Documentation Type
      description: What type of documentation issue is this?
      options:
        - Missing documentation
        - Outdated documentation
        - Incorrect documentation
        - Clarity improvement
        - New documentation needed
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: Where is the documentation located?
      placeholder: "https://docs.veroprotocol.io/audit-guard/getting-started"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the documentation issue
      placeholder: |
        The getting started guide doesn't mention how to configure the audit guard for production use.
    validations:
      required: true

  - type: textarea
    id: suggested-change
    attributes:
      label: Suggested Change
      description: How would you improve the documentation?
      placeholder: |
        Add a section about production configuration with environment variables.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information
      placeholder: |
        This is important because...

  - type: checkbox
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to contribute this documentation change?
      options:
        - label: I am willing to contribute this change

  - type: markdown
    attributes:
      value: |
        ---
        **If you pick this issue up:** the pull request that closes it needs a
        **detailed description** — what was wrong, the approach you took, anything
        the reviewer should look at closely, and how you verified it. A one-line
        description will be sent back before review. See CONTRIBUTING.md.
