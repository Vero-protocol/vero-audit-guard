[package]
name = "audit-guard"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
notify = "6"
log = "0.4"
chrono = "0.4"
regorus = { version = "0.11", default-features = false, features = ["std", "regex"] }

[dev-dependencies]
wiremock = "0.5"
tempfile = "3"
